name: Build Desktop Releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name CloudZZZQueueMonitor cloud_zzz_queue_guard_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudZZZQueueMonitor-windows
          path: dist/CloudZZZQueueMonitor.exe

      - name: Upload Windows release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CloudZZZQueueMonitor.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build native macOS Dynamic Island app
        run: |
          mkdir -p build/CloudZZZQueueMonitor.app/Contents/MacOS build/CloudZZZQueueMonitor.app/Contents/Resources
          swiftc -parse-as-library -O QueueWindow.swift \
            -o build/CloudZZZQueueMonitor.app/Contents/MacOS/CloudZZZQueueMonitor \
            -framework Cocoa \
            -framework SwiftUI
          cp QueueWindow-Info.plist build/CloudZZZQueueMonitor.app/Contents/Info.plist

      - name: Build bundled macOS monitor core
        run: |
          pyinstaller --clean --onefile \
            --name CloudZZZQueueMonitorCore \
            cloud_zzz_queue_guard_gui.py
          cp dist/CloudZZZQueueMonitorCore build/CloudZZZQueueMonitor.app/Contents/Resources/CloudZZZQueueMonitorCore
          chmod +x build/CloudZZZQueueMonitor.app/Contents/MacOS/CloudZZZQueueMonitor
          chmod +x build/CloudZZZQueueMonitor.app/Contents/Resources/CloudZZZQueueMonitorCore
          codesign --force --deep --sign - build/CloudZZZQueueMonitor.app

      - name: Package app zip
        run: ditto -c -k --sequesterRsrc --keepParent build/CloudZZZQueueMonitor.app dist/CloudZZZQueueMonitor-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudZZZQueueMonitor-macOS
          path: dist/CloudZZZQueueMonitor-macOS.zip

      - name: Upload macOS release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CloudZZZQueueMonitor-macOS.zip
