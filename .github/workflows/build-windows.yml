name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name CloudZZZQueueMonitor cloud_zzz_queue_guard_windows.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudZZZQueueMonitor-windows
          path: dist/CloudZZZQueueMonitor.exe

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CloudZZZQueueMonitor.exe
